<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>I-JO House GYM | Admin Login</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #080808, #1c1c1c, #080808);
      color: #fff;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      padding: 40px 32px;
      background: #151515;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 16px;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.6);
      text-align: center;
    }

    .logo {
      font-size: 27px;
      font-weight: 800;
      color: #d4af37;
      letter-spacing: 1px;
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    .subtitle {
      font-size: 14px;
      color: #aaa;
      margin-bottom: 32px;
      line-height: 1.6;
    }

    h2 {
      font-size: 25px;
      margin-bottom: 25px;
    }

    h2::after {
      content: "";
      display: block;
      width: 55px;
      height: 3px;
      margin: 12px auto 0;
      background: #d4af37;
      border-radius: 5px;
    }

    #adminLoginForm {
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    #adminLoginForm input {
      width: 100%;
      padding: 15px 16px;
      background: #222;
      color: #fff;
      border: 1px solid #383838;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    #adminLoginForm input:focus {
      border-color: #d4af37;
      box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.12);
    }

    #adminLoginForm input::placeholder {
      color: #999;
    }

    #adminLoginForm button {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #f3d46b, #c49b21);
      color: #111;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 800;
      cursor: pointer;
    }

    #adminLoginForm button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #loginMessage {
      font-size: 14px;
      line-height: 1.5;
      min-height: 20px;
      overflow-wrap: anywhere;
      color: #ff7777;
    }

    .back-link {
      display: inline-block;
      margin-top: 22px;
      color: #d4af37;
      text-decoration: none;
      font-size: 14px;
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 32px 22px;
      }

      .logo {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>
  <main class="login-box">
    <div class="logo">I-JO House GYM</div>
    <p class="subtitle">Your fitness journey starts here.</p>

    <h2>Admin Login</h2>

    <form id="adminLoginForm">
      <input
        type="text"
        name="username"
        placeholder="Admin Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        name="password"
        placeholder="Admin Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>
      <p id="loginMessage" role="status" aria-live="polite"></p>
    </form>

    <a class="back-link" href="index.html">← Back to Home</a>
  </main>

 <script>
  const form = document.getElementById("adminLoginForm");
  const message = document.getElementById("loginMessage");
  const button = form.querySelector('button[type="submit"]');

  const API_URL = "https://gym-cdb7.onrender.com";

  form.addEventListener("submit", async function (event) {
    event.preventDefault();

    const username = form.elements.username.value.trim();
    const password = form.elements.password.value;

    message.textContent = "";
    button.disabled = true;
    button.textContent = "Logging in...";

    try {
      const response = await fetch(
        `${API_URL}/api/admin/login`,
        {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          credentials: "include",
          body: JSON.stringify({
            adminUsername: username,
            adminPassword: password
          })
        }
      );

      const result = await response.json().catch(() => ({}));

      if (!response.ok || result.success !== true) {
        message.textContent =
          result.message ||
          (response.status === 404
            ? "Login API not found. Check backend route."
            : "Login failed. Check username and password.");
        return;
      }

      window.location.replace(
        result.redirect || "admin.html"
      );

    } catch (error) {
      console.error("Login error:", error);
      message.textContent =
        "Cannot connect to server. Check backend and network.";
    } finally {
      button.disabled = false;
      button.textContent = "Login";
    }
  });
</script>
</body>
</html>
